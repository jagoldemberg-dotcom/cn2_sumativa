version: "3.8"

services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: sumativa-oracle-db
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-OraclePwd123}
      APP_USER: ${ORACLE_APP_USER:-sumativa}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:-OraclePwd123}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./db/oracle:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 60s

  bff-service:
    build:
      context: ./bff-service
    container_name: sumativa-bff-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      FUNCTIONS_USERS_BASE_URL: ${FUNCTIONS_USERS_BASE_URL:-http://host.docker.internal:7071/api}
      FUNCTIONS_ROLES_GRAPHQL_URL: ${FUNCTIONS_ROLES_GRAPHQL_URL:-http://host.docker.internal:7072/api/graphql}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      oracle-db:
        condition: service_healthy

volumes:
  oracle-data:
